name: CI

on:
  push:
    branches: [main]
    tags: ["v[0-9]*"]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm spec:validate
      - run: node --test scripts/check-architecture.mjs
      - run: node --test scripts/storage-docs.test.mjs
      - run: node --test scripts/tauri-security.test.mjs scripts/tauri-packaging.test.mjs scripts/desktop-release.test.mjs
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - name: Check shared services
        run: cargo check --locked --workspace --exclude coshell-desktop
      - run: cargo test --locked --workspace --exclude coshell-desktop

  release-version:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify release tag and application versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/desktop-release.mjs version "$RELEASE_TAG"

  desktop-bundle:
    needs: release-version
    if: ${{ !cancelled() && (needs.release-version.result == 'success' || needs.release-version.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            asset: windows-x64
            extension: exe
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
            asset: macos-x64
            extension: dmg
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            asset: macos-arm64
            extension: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
      - name: Collect installer
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          BUILD_TARGET: ${{ matrix.target }}
          ASSET_PLATFORM: ${{ matrix.asset }}
          ASSET_EXTENSION: ${{ matrix.extension }}
        run: |
          $bundle = "target/$env:BUILD_TARGET/release/bundle"
          $installer = @(Get-ChildItem -LiteralPath $bundle -Recurse -File -Filter "*.$env:ASSET_EXTENSION")
          if ($installer.Count -ne 1) { throw "Expected one installer in $bundle, found $($installer.Count)" }
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Path release-assets | Out-Null
          Copy-Item -LiteralPath $installer[0].FullName -Destination "release-assets/CoShell_${version}_$env:ASSET_PLATFORM.$env:ASSET_EXTENSION"
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: installer-${{ matrix.asset }}
          path: release-assets/
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: coshell-${{ matrix.target }}-unsigned
          path: target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error

  release-draft:
    if: github.ref_type == 'tag' && github.repository == 'Yidoll/CoShell'
    needs: [frontend, rust, desktop-bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-draft-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: release-assets
      - name: Create GitHub Release draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          version=$(node scripts/desktop-release.mjs version "$RELEASE_TAG")
          node scripts/desktop-release.mjs checksums "$RELEASE_TAG" release-assets
          installers=(
            "release-assets/CoShell_${version}_windows-x64.exe"
            "release-assets/CoShell_${version}_macos-x64.dmg"
            "release-assets/CoShell_${version}_macos-arm64.dmg"
            "release-assets/SHA256SUMS.txt"
          )
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" |
            jq 'add // []' > "$RUNNER_TEMP/coshell-releases.json"
          draft=$(node scripts/desktop-release.mjs draft "$RELEASE_TAG" "$RUNNER_TEMP/coshell-releases.json")
          case "$draft" in
            published) echo "Release $RELEASE_TAG is already published." ;;
            pending) gh release upload "$RELEASE_TAG" "${installers[@]}" --clobber ;;
            absent) gh release create "$RELEASE_TAG" "${installers[@]}" --verify-tag --draft \
                --title "CoShell $version" --notes-file docs/release-notes-desktop.md ;;
            *) exit 1 ;;
          esac
