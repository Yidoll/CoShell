name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm spec:validate
      - run: node --test scripts/check-architecture.mjs
      - run: node --test scripts/storage-docs.test.mjs
      - run: node --test scripts/tauri-security.test.mjs scripts/tauri-packaging.test.mjs scripts/desktop-release.test.mjs
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - name: Check shared services
        run: cargo check --locked --workspace --exclude coshell-desktop
      - run: cargo test --locked --workspace --exclude coshell-desktop

  desktop-bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-15
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      # Unsigned CI artifacts; release signing and notarization require secrets.
      - run: pnpm exec tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: coshell-${{ matrix.target }}-unsigned
          path: target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error
